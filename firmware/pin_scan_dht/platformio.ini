; O.I.N.K. — DHT pin / model finder (diagnostic)
; -----------------------------------------------
; Answers two questions without reading breadboard rows:
;   1. Which GPIO does the DHT data line actually reach?
;   2. Is it a DHT22 (AM2302) or a DHT11?
;
; Diagnostic only. Once it names the pin and model, use dht22_test/.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = beegee-tokyo/DHT sensor library for ESPx
