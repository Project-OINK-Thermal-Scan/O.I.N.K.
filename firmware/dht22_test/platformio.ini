; O.I.N.K. — DHT22 (AM2302) temperature + humidity test
; ------------------------------------------------------
; Board: classic ESP32 DevKit (WROOM-32)  -> board id: esp32dev
;
; Wiring (follow the labels printed on the module):
;   +   -> 3V3     (NOT 5V: the onboard pull-up ties DATA to VCC)
;   out -> GPIO4   (normal GPIO; NOT 34-39)
;   -   -> GND
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = beegee-tokyo/DHT sensor library for ESPx
