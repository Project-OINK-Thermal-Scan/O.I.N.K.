; O.I.N.K. — ESP32-CAM MJPEG streamer (CameraWebServer example)
; -----------------------------------------------------------------
; Board: AI Thinker ESP32-CAM  (board id: esp32cam)
;
; The esp32cam board definition already enables PSRAM (-DBOARD_HAS_PSRAM) and
; the huge_app partition (>= 3 MB app), which the camera web server requires.
;
; BEFORE FLASHING: edit src/main.cpp and set your Wi-Fi ssid/password.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; NOTE: this board has no mic and only shares the camera pins — keep it as a
; separate video node, do NOT merge it with the DevKit sensor node.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
