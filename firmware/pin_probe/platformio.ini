; O.I.N.K. — pin probe (diagnostic)
; ----------------------------------
; The DHT scan found no sensor on any pin, yet the data wire is on GPIO4.
; So the question is no longer "which pin" but "is the module powered".
;
; This measures that electrically by reading each pin twice: once with the
; ESP32's internal pull-up, once with its internal pull-down. A module that
; is powered holds its data line high through its own 10 k pull-up, which
; wins against the internal pull-down. Nothing connected = floats.
;
; Diagnostic only. Nothing here touches the flash.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
